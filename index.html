<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" href="data:," />
    <title>JCGS Swamivatsalya RSVP — Test App</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Lora:wght@500;600;700&family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <style>
      :root {
        --bg: #faf7f2;
        --surface: #ffffff;
        --surface-2: #f3ede3;
        --ink: #2b2118;
        --ink-soft: #5d5142;
        --ink-faint: #8a7c68;
        --line: #e2d8c8;
        --maroon: #7c2128;
        --maroon-deep: #5f161d;
        --maroon-soft: #f7e9e7;
        --gold: #b07d1e;
        --gold-soft: #f6ecd4;
        --green: #2e6b34;
        --green-soft: #e4efe1;
        --wa: #1f7a4d;
        --wa-soft: #e2f2e8;
        --danger: #a02c22;
        --danger-soft: #f9e7e4;
        --shadow: 0 1px 2px rgba(60, 40, 10, .06), 0 8px 24px rgba(60, 40, 10, .07);
        --radius: 14px;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #171310;
          --surface: #221c17;
          --surface-2: #2b241d;
          --ink: #f0e8dc;
          --ink-soft: #c9bba6;
          --ink-faint: #978a76;
          --line: #3d332a;
          --maroon: #e08a90;
          --maroon-deep: #eda6ab;
          --maroon-soft: #3a2226;
          --gold: #d9a94e;
          --gold-soft: #38301d;
          --green: #8fce97;
          --green-soft: #22331f;
          --wa: #7fd6a4;
          --wa-soft: #1e3328;
          --danger: #ef9a8f;
          --danger-soft: #3a2320;
          --shadow: 0 1px 2px rgba(0,0,0,.35), 0 8px 24px rgba(0,0,0,.3);
        }
      }
      * { box-sizing: border-box; }
      html { -webkit-text-size-adjust: 100%; }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font-family: "Public Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
        font-size: 17px;
        line-height: 1.5;
      }
      .wrap { max-width: 720px; margin: 0 auto; padding: 0 16px 56px; }

      /* ---------- header ---------- */
      header.top {
        padding: 28px 0 6px;
        text-align: center;
      }
      header.top h1 {
        font-family: "Lora", Georgia, serif;
        font-size: 30px; font-weight: 700; line-height: 1.15;
        margin: 0 0 4px;
      }
      header.top .org { color: var(--ink-soft); font-size: 15px; margin: 0; }
      .test-tag {
        display: inline-block; margin-top: 10px;
        font-size: 12.5px; font-weight: 700; letter-spacing: .04em;
        color: var(--gold); background: var(--gold-soft);
        border: 1px solid var(--gold);
        padding: 3px 10px; border-radius: 999px;
      }

      /* ---------- tabs ---------- */
      nav.tabs {
        display: flex; gap: 8px;
        margin: 22px 0 20px;
        background: var(--surface-2);
        border: 1px solid var(--line);
        border-radius: 999px;
        padding: 5px;
        position: sticky; top: 10px; z-index: 20;
      }
      nav.tabs button {
        flex: 1; appearance: none; border: 0; cursor: pointer;
        background: transparent; color: var(--ink-soft);
        font: inherit; font-weight: 600; font-size: 16px;
        padding: 10px 8px; border-radius: 999px;
      }
      nav.tabs button[aria-selected="true"] {
        background: var(--maroon); color: #fff;
      }
      @media (prefers-color-scheme: dark) {
        nav.tabs button[aria-selected="true"] { background: var(--maroon-soft); color: var(--maroon-deep); box-shadow: inset 0 0 0 1.5px var(--maroon); }
      }
      nav.tabs .count {
        display: inline-block; min-width: 22px; text-align: center;
        background: var(--gold); color: #fff;
        font-size: 13px; font-weight: 700;
        border-radius: 999px; padding: 0 6px; margin-left: 6px;
        vertical-align: 1px;
      }

      /* ---------- event cards ---------- */
      .event {
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: var(--radius);
        box-shadow: var(--shadow);
        padding: 18px;
        margin-bottom: 16px;
        display: flex; gap: 16px;
      }
      .datebox {
        flex: 0 0 64px; text-align: center;
        border: 1.5px solid var(--line);
        border-radius: 10px;
        padding: 8px 0 6px;
        background: var(--surface-2);
        height: fit-content;
      }
      .datebox .dow { font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--maroon); }
      .datebox .day { font-family: "Lora", Georgia, serif; font-size: 28px; font-weight: 700; line-height: 1.1; }
      .datebox .mon { font-size: 13px; color: var(--ink-soft); font-weight: 600; }
      .event .body { flex: 1; min-width: 0; }
      .event h2 {
        font-family: "Lora", Georgia, serif;
        font-size: 20px; font-weight: 600; line-height: 1.25;
        margin: 0 0 6px;
      }
      .meta { color: var(--ink-soft); font-size: 15px; margin: 0 0 2px; }
      .meta b { color: var(--ink); font-weight: 600; }
      .spots { margin-top: 12px; }
      .spots .nums { display: flex; justify-content: space-between; font-size: 14px; color: var(--ink-soft); margin-bottom: 5px; }
      .spots .nums b { color: var(--ink); }
      .bar { height: 8px; border-radius: 999px; background: var(--surface-2); border: 1px solid var(--line); overflow: hidden; }
      .bar i { display: block; height: 100%; background: var(--gold); border-radius: 999px; }
      .bar i.low { background: var(--danger); }
      .spots-left { font-weight: 700; color: var(--green); }
      .spots-left.low { color: var(--danger); }
      .full-tag {
        display: inline-block; font-weight: 700; font-size: 14px;
        color: var(--danger); background: var(--danger-soft);
        padding: 4px 12px; border-radius: 999px; margin-top: 12px;
      }
      .mine-tag {
        display: inline-block; font-weight: 700; font-size: 14px;
        color: var(--green); background: var(--green-soft);
        padding: 4px 12px; border-radius: 999px; margin-top: 12px;
      }

      /* ---------- buttons ---------- */
      .btn {
        appearance: none; cursor: pointer; font: inherit; font-weight: 700;
        border-radius: 10px; border: 1.5px solid transparent;
        padding: 12px 20px; font-size: 16px;
        display: inline-block; text-align: center; text-decoration: none;
      }
      .btn-primary { background: var(--maroon); color: #fff; }
      .btn-primary:active { background: var(--maroon-deep); }
      @media (prefers-color-scheme: dark) {
        .btn-primary { background: var(--maroon-soft); color: var(--maroon-deep); border-color: var(--maroon); }
      }
      .btn-ghost { background: transparent; color: var(--maroon); border-color: var(--maroon); }
      .btn-quiet { background: var(--surface-2); color: var(--ink); border-color: var(--line); }
      .btn-danger { background: transparent; color: var(--danger); border-color: var(--danger); }
      .btn[disabled] { opacity: .45; cursor: not-allowed; }
      .btn-block { display: block; width: 100%; }
      .event .actions { margin-top: 14px; display: flex; gap: 10px; flex-wrap: wrap; }
      .event .actions .btn { padding: 10px 18px; }

      /* ---------- forms ---------- */
      .panel {
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: var(--radius);
        box-shadow: var(--shadow);
        padding: 20px 18px;
      }
      .backlink {
        appearance: none; background: none; border: 0; cursor: pointer;
        font: inherit; font-weight: 600; color: var(--maroon);
        padding: 4px 0; margin-bottom: 10px;
      }
      .panel h2 {
        font-family: "Lora", Georgia, serif;
        font-size: 23px; font-weight: 600; margin: 0 0 4px; line-height: 1.25;
      }
      .panel .sub { color: var(--ink-soft); margin: 0 0 18px; font-size: 15.5px; }
      .field { margin-bottom: 18px; }
      .field label, .field .lab {
        display: block; font-weight: 600; font-size: 15.5px; margin-bottom: 7px;
      }
      .field .hint { font-weight: 400; color: var(--ink-faint); font-size: 14px; }
      .field input[type="text"], .field input[type="email"], .field input[type="tel"], .field textarea {
        width: 100%; font: inherit; font-size: 17px;
        padding: 12px 13px;
        border: 1.5px solid var(--line); border-radius: 10px;
        background: var(--bg); color: var(--ink);
      }
      .field input:focus, .field textarea:focus { outline: 2px solid var(--gold); outline-offset: 1px; border-color: var(--gold); }
      .field textarea { resize: vertical; min-height: 74px; }
      .field .err { display: none; color: var(--danger); font-size: 14.5px; font-weight: 600; margin-top: 6px; }
      .field.invalid input { border-color: var(--danger); }
      .field.invalid .err { display: block; }

      #contact-err { margin: -6px 0 18px; }
      .stepper { display: flex; align-items: center; gap: 14px; }
      .stepper button {
        appearance: none; cursor: pointer;
        width: 46px; height: 46px; border-radius: 50%;
        border: 1.5px solid var(--maroon); background: var(--surface);
        color: var(--maroon); font-size: 24px; font-weight: 700; line-height: 1;
        display: grid; place-items: center;
      }
      .stepper button[disabled] { opacity: .35; cursor: not-allowed; }
      .stepper .val { font-size: 22px; font-weight: 700; min-width: 30px; text-align: center; }
      .stepper .who { color: var(--ink-soft); font-size: 15px; }
      .party-err { display: none; color: var(--danger); font-size: 14.5px; font-weight: 600; margin-top: 6px; }
      .party-err.show { display: block; }

      .form-note {
        background: var(--gold-soft); border: 1px solid var(--gold);
        border-radius: 10px; padding: 12px 14px; font-size: 15px; margin-bottom: 18px;
      }

      /* ---------- confirmation ---------- */
      .confirm { text-align: center; padding: 30px 22px; }
      .confirm .tick {
        width: 66px; height: 66px; margin: 0 auto 14px;
        border-radius: 50%; background: var(--green-soft);
        display: grid; place-items: center;
        color: var(--green); font-size: 34px; font-weight: 700;
      }
      .confirm h2 { margin-bottom: 6px; }
      .confirm .sent {
        background: var(--surface-2); border: 1px solid var(--line);
        border-radius: 10px; padding: 13px 15px; margin: 16px 0;
        font-size: 16px;
      }
      .confirm dl {
        text-align: left; margin: 0 auto 20px; max-width: 420px;
        display: grid; grid-template-columns: auto 1fr; gap: 5px 16px; font-size: 16px;
      }
      .confirm dt { color: var(--ink-soft); font-weight: 600; }
      .confirm dd { margin: 0; font-weight: 600; }
      .confirm .actions { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }

      /* ---------- my rsvps ---------- */
      .rsvp-card {
        background: var(--surface); border: 1px solid var(--line);
        border-radius: var(--radius); box-shadow: var(--shadow);
        padding: 18px; margin-bottom: 16px;
      }
      .rsvp-card h3 {
        font-family: "Lora", Georgia, serif; font-size: 19px; font-weight: 600;
        margin: 0 0 4px; line-height: 1.3;
      }
      .rsvp-card .meta { margin-bottom: 10px; }
      .kv { display: flex; flex-wrap: wrap; gap: 6px 18px; font-size: 15.5px; margin-bottom: 12px; }
      .kv span b { font-weight: 700; }
      .chan-badge {
        display: inline-block; font-size: 13.5px; font-weight: 700;
        padding: 3px 10px; border-radius: 999px;
      }
      .chan-badge.email { color: var(--maroon); background: var(--maroon-soft); }
      .chan-badge.whatsapp { color: var(--wa); background: var(--wa-soft); }
      .rsvp-card .actions { display: flex; gap: 10px; flex-wrap: wrap; }
      .rsvp-card .actions .btn { padding: 9px 16px; font-size: 15px; }
      .cancel-box {
        margin-top: 12px; background: var(--danger-soft);
        border: 1px solid var(--danger); border-radius: 10px; padding: 13px 14px;
      }
      .cancel-box p { margin: 0 0 10px; font-size: 15.5px; }
      .cancel-box .row { display: flex; gap: 10px; flex-wrap: wrap; }
      .cancel-box .btn { padding: 8px 15px; font-size: 15px; }

      .empty {
        text-align: center; padding: 44px 20px;
        background: var(--surface); border: 1px dashed var(--line);
        border-radius: var(--radius); color: var(--ink-soft);
      }
      .empty .big { font-family: "Lora", Georgia, serif; font-size: 21px; color: var(--ink); margin: 0 0 6px; }
      .empty p { margin: 0 0 16px; }

      footer.note {
        margin-top: 30px; text-align: center;
        color: var(--ink-faint); font-size: 13.5px; line-height: 1.55;
      }
      .toast {
        position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%) translateY(20px);
        background: var(--ink); color: var(--bg);
        padding: 12px 20px; border-radius: 999px; font-weight: 600; font-size: 15.5px;
        opacity: 0; pointer-events: none; transition: opacity .25s, transform .25s;
        max-width: calc(100vw - 32px); text-align: center; z-index: 50;
        box-shadow: var(--shadow);
      }
      .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
      [hidden] { display: none !important; }
      @media (max-width: 480px) {
        .event { flex-direction: column; gap: 12px; }
        .datebox { display: flex; align-items: baseline; gap: 8px; padding: 6px 12px; width: fit-content; }
        .datebox .day { font-size: 22px; }
        header.top h1 { font-size: 26px; }
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <header class="top">
        <h1>Swamivatsalya RSVP</h1>
        <p class="org">Jain Center of Greater Sacramento</p>
        <span class="test-tag">TEST APP — PILOT PREVIEW</span>
      </header>

      <nav class="tabs" role="tablist" aria-label="App sections">
        <button id="tab-events" role="tab" aria-selected="true">Events</button>
        <button id="tab-mine" role="tab" aria-selected="false">My RSVPs<span class="count" id="mine-count" hidden>0</span></button>
      </nav>

      <!-- EVENTS VIEW -->
      <section id="view-events" aria-label="Upcoming events"></section>

      <!-- FORM VIEW -->
      <section id="view-form" hidden aria-label="RSVP form"></section>

      <!-- CONFIRMATION VIEW -->
      <section id="view-confirm" hidden aria-label="Confirmation"></section>

      <!-- MY RSVPS VIEW -->
      <section id="view-mine" hidden aria-label="My RSVPs"></section>

      <footer class="note">
        Test build with sample events. RSVPs are kept only while this page is open — nothing is sent or saved.<br />
        Headcount only — JCGS Swamivatsalya RSVPs never include food items.
      </footer>
    </div>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <script>
      "use strict";

      /* ---------------- sample data (test events) ---------------- */
      var EVENTS = [
        {
          id: "ev-katik",
          title: "Kartik Maas Swamivatsalya",
          dow: "Sat", day: "31", mon: "Oct",
          dateLabel: "Saturday, October 31, 2026",
          time: "12:00 PM", place: "JCGS Temple Hall",
          rsvpBy: "RSVP by Thu, Oct 29",
          capacity: 60, booked: 60
        },
        {
          id: "ev-nov1",
          title: "Sunday Swamivatsalya",
          dow: "Sun", day: "1", mon: "Nov",
          dateLabel: "Sunday, November 1, 2026",
          time: "12:30 PM", place: "JCGS Temple Hall",
          rsvpBy: "RSVP by Fri, Oct 30",
          capacity: 180, booked: 171
        },
        {
          id: "ev-diwali",
          title: "Diwali Swamivatsalya",
          dow: "Sun", day: "8", mon: "Nov",
          dateLabel: "Sunday, November 8, 2026 — Diwali",
          time: "1:00 PM", place: "JCGS Temple Hall",
          rsvpBy: "RSVP by Thu, Nov 5",
          capacity: 300, booked: 214
        },
        {
          id: "ev-nov15",
          title: "Sunday Swamivatsalya",
          dow: "Sun", day: "15", mon: "Nov",
          dateLabel: "Sunday, November 15, 2026",
          time: "12:30 PM", place: "JCGS Temple Hall",
          rsvpBy: "RSVP by Fri, Nov 13",
          capacity: 180, booked: 96
        }
      ];

      /* ---------------- state (in memory only) ---------------- */
      var myRsvps = [];   // {id, eventId, name, channel: email|whatsapp|both, email, phone, adults, children, comment}
      var seq = 1;
      var formCtx = null; // {eventId, rsvpId|null, adults, children}

      /* ---------------- helpers ---------------- */
      function $(id) { return document.getElementById(id); }
      function esc(s) {
        return String(s == null ? "" : s)
          .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
      }
      function eventById(id) {
        for (var i = 0; i < EVENTS.length; i++) if (EVENTS[i].id === id) return EVENTS[i];
        return null;
      }
      function mySeats(eventId, excludeRsvpId) {
        var n = 0;
        myRsvps.forEach(function (r) {
          if (r.eventId === eventId && r.id !== excludeRsvpId) n += r.adults + r.children;
        });
        return n;
      }
      function attending(ev) { return ev.booked + mySeats(ev.id, null); }
      function spotsLeft(ev) { return Math.max(0, ev.capacity - attending(ev)); }
      function myRsvpFor(eventId) {
        for (var i = 0; i < myRsvps.length; i++) if (myRsvps[i].eventId === eventId) return myRsvps[i];
        return null;
      }
      function maskEmail(email) {
        var parts = String(email).split("@");
        if (parts.length !== 2) return email;
        var local = parts[0];
        var shown = local.length <= 2 ? local.charAt(0) + "•" : local.charAt(0) + "•••" + local.charAt(local.length - 1);
        return shown + "@" + parts[1];
      }
      function maskPhone(phone) {
        var digits = String(phone).replace(/\D/g, "");
        var last4 = digits.slice(-4);
        return "•••" + (last4 ? " " + last4 : "");
      }
      function hasEmail(r) { return !!(r.email && String(r.email).trim()); }
      function hasPhone(r) { return !!(r.phone && String(r.phone).trim()); }
      function contactLabel(r) {
        if (hasEmail(r) && hasPhone(r)) return "Email & WhatsApp";
        if (hasPhone(r)) return "WhatsApp";
        return "Email";
      }
      function channelLabel(ch) { return ch === "whatsapp" ? "WhatsApp" : ch === "both" ? "Email & WhatsApp" : "Email"; }
      function sentLine(r) {
        if (hasEmail(r) && hasPhone(r)) {
          return "Your confirmation & manage link were sent by <b>Email</b> to <b>" + esc(maskEmail(r.email)) + "</b> and by <b>WhatsApp</b> to <b>" + esc(maskPhone(r.phone)) + "</b>.";
        }
        if (hasPhone(r)) {
          return "Your confirmation & manage link were sent by <b>WhatsApp</b> to <b>" + esc(maskPhone(r.phone)) + "</b>.";
        }
        return "Your confirmation & manage link were sent by <b>Email</b> to <b>" + esc(maskEmail(r.email)) + "</b>.";
      }
      var toastTimer = null;
      function toast(msg) {
        var t = $("toast");
        t.textContent = msg;
        t.classList.add("show");
        if (toastTimer) clearTimeout(toastTimer);
        toastTimer = setTimeout(function () { t.classList.remove("show"); }, 3200);
      }

      /* ---------------- view switching ---------------- */
      var VIEWS = ["events", "form", "confirm", "mine"];
      function show(view) {
        VIEWS.forEach(function (v) { $("view-" + v).hidden = v !== view; });
        var onEvents = view === "events" || view === "form" || view === "confirm";
        $("tab-events").setAttribute("aria-selected", onEvents ? "true" : "false");
        $("tab-mine").setAttribute("aria-selected", view === "mine" ? "true" : "false");
        window.scrollTo(0, 0);
      }
      function updateMineCount() {
        var c = $("mine-count");
        c.textContent = myRsvps.length;
        c.hidden = myRsvps.length === 0;
      }

      /* ---------------- events list ---------------- */
      function renderEvents() {
        var html = "";
        EVENTS.forEach(function (ev) {
          var left = spotsLeft(ev);
          var att = attending(ev);
          var pct = Math.min(100, Math.round(att / ev.capacity * 100));
          var low = left > 0 && left <= 15;
          var mine = myRsvpFor(ev.id);
          html += '<article class="event">' +
            '<div class="datebox"><div class="dow">' + esc(ev.dow) + '</div><div class="day">' + esc(ev.day) + '</div><div class="mon">' + esc(ev.mon) + '</div></div>' +
            '<div class="body">' +
              '<h2>' + esc(ev.title) + '</h2>' +
              '<p class="meta"><b>' + esc(ev.time) + '</b> · ' + esc(ev.place) + '</p>' +
              '<p class="meta">' + esc(ev.rsvpBy) + '</p>' +
              '<div class="spots"><div class="nums"><span><b>' + att + '</b> attending</span>' +
              (left > 0
                ? '<span class="spots-left' + (low ? " low" : "") + '">' + left + ' spots left</span>'
                : '<span class="spots-left low">Full</span>') +
              '</div><div class="bar"><i class="' + (low || left === 0 ? "low" : "") + '" style="width:' + pct + '%"></i></div></div>' +
              (mine
                ? '<span class="mine-tag">✓ You\u2019re RSVP\u2019d — ' + (mine.adults + mine.children) + ' in your party</span>'
                : (left === 0 ? '<span class="full-tag">This event is full</span>' : '')) +
              '<div class="actions">' +
                (mine
                  ? '<button class="btn btn-ghost" data-act="edit" data-id="' + mine.id + '">Modify my RSVP</button>'
                  : '<button class="btn btn-primary" data-act="rsvp" data-id="' + ev.id + '"' + (left === 0 ? " disabled" : "") + '>RSVP</button>') +
              '</div>' +
            '</div></article>';
        });
        $("view-events").innerHTML = html;
      }

      /* ---------------- RSVP form ---------------- */
      function openForm(eventId, rsvpId) {
        var ev = eventById(eventId);
        var existing = rsvpId ? myRsvps.filter(function (r) { return r.id === rsvpId; })[0] : null;
        formCtx = {
          eventId: eventId,
          rsvpId: rsvpId || null,
          adults: existing ? existing.adults : 2,
          children: existing ? existing.children : 0
        };
        var left = ev.capacity - (ev.booked + mySeats(eventId, rsvpId || undefined));
        var html =
          '<button class="backlink" data-act="back-events">← All events</button>' +
          '<div class="panel">' +
            '<h2>' + (existing ? "Modify your RSVP" : "RSVP") + ' — ' + esc(ev.title) + '</h2>' +
            '<p class="sub">' + esc(ev.dateLabel) + ' · ' + esc(ev.time) + ' · ' + esc(ev.place) + '<br />' +
            left + ' spots left · Headcount only, please</p>' +

            '<div class="field" id="f-name">' +
              '<label for="in-name">Your name</label>' +
              '<input type="text" id="in-name" autocomplete="name" placeholder="Full name" value="' + esc(existing ? existing.name : "") + '" />' +
              '<div class="err">Please enter your name.</div>' +
            '</div>' +

            '<div class="form-note"><b>How can we reach you?</b> Give at least one — your <b>email</b> or your <b>WhatsApp number</b> (or both). Your confirmation &amp; manage link will be sent to what you provide; if you give both, we\u2019ll send to both.</div>' +

            '<div class="field" id="f-email">' +
              '<label for="in-email">Email address <span class="hint">(at least one of email / WhatsApp is required)</span></label>' +
              '<input type="email" id="in-email" autocomplete="email" inputmode="email" placeholder="you@example.com" value="' + esc(existing ? existing.email : "") + '" />' +
              '<div class="err">Please enter a valid email address, or leave this blank and give your WhatsApp number below.</div>' +
            '</div>' +

            '<div class="field" id="f-phone">' +
              '<label for="in-phone">Mobile / WhatsApp number <span class="hint">(at least one of email / WhatsApp is required)</span></label>' +
              '<input type="tel" id="in-phone" autocomplete="tel" inputmode="tel" placeholder="(916) 555-0123" value="' + esc(existing ? existing.phone : "") + '" />' +
              '<div class="err">Please enter a valid mobile number, or leave this blank and give your email above.</div>' +
            '</div>' +
            '<div class="party-err" id="contact-err" role="alert"></div>' +

            '<div class="field">' +
              '<span class="lab">How many are coming?</span>' +
              '<div class="stepper" style="margin-bottom:12px;">' +
                '<button type="button" data-act="step" data-who="adults" data-d="-1" aria-label="Fewer adults">−</button>' +
                '<span class="val" id="val-adults">2</span>' +
                '<button type="button" data-act="step" data-who="adults" data-d="1" aria-label="More adults">+</button>' +
                '<span class="who">Adults</span>' +
              '</div>' +
              '<div class="stepper">' +
                '<button type="button" data-act="step" data-who="children" data-d="-1" aria-label="Fewer children">−</button>' +
                '<span class="val" id="val-children">0</span>' +
                '<button type="button" data-act="step" data-who="children" data-d="1" aria-label="More children">+</button>' +
                '<span class="who">Children</span>' +
              '</div>' +
              '<div class="party-err" id="party-err"></div>' +
            '</div>' +

            '<div class="field">' +
              '<label for="in-comment">Comment <span class="hint">(optional)</span></label>' +
              '<textarea id="in-comment" placeholder="Anything the organizers should know — seating needs, arriving late, etc.">' + esc(existing ? existing.comment : "") + '</textarea>' +
            '</div>' +

            '<button class="btn btn-primary btn-block" data-act="submit">' + (existing ? "Save changes" : "Confirm RSVP") + '</button>' +
          '</div>';
        $("view-form").innerHTML = html;
        syncSteppers();
        show("form");
      }

      function syncSteppers() {
        $("val-adults").textContent = formCtx.adults;
        $("val-children").textContent = formCtx.children;
        document.querySelectorAll("[data-act='step']").forEach(function (b) {
          var who = b.getAttribute("data-who"), d = parseInt(b.getAttribute("data-d"), 10);
          var v = who === "adults" ? formCtx.adults : formCtx.children;
          b.disabled = (d < 0 && v <= 0) || (d > 0 && v >= 20);
        });
      }

      function fieldInvalid(id, bad) {
        $(id).classList.toggle("invalid", !!bad);
        return !bad;
      }

      function submitForm() {
        var ev = eventById(formCtx.eventId);
        var name = $("in-name").value.trim();
        var email = $("in-email").value.trim();
        var phone = $("in-phone").value.trim();
        var comment = $("in-comment").value.trim();
        var ok = true;

        ok = fieldInvalid("f-name", !name) && ok;
        var hasE = email !== "";
        var hasP = phone !== "";
        var emailOk = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
        var phoneDigits = phone.replace(/\D/g, "");
        var phoneOk = phoneDigits.length >= 10 && phoneDigits.length <= 15;
        var cerr = $("contact-err");
        if (!hasE && !hasP) {
          fieldInvalid("f-email", true);
          fieldInvalid("f-phone", true);
          cerr.textContent = "Please give at least one — your email or your WhatsApp number — so we can send your confirmation & manage link.";
          cerr.classList.add("show");
          ok = false;
        } else {
          cerr.classList.remove("show");
          if (hasE) ok = fieldInvalid("f-email", !emailOk) && ok; else fieldInvalid("f-email", false);
          if (hasP) ok = fieldInvalid("f-phone", !phoneOk) && ok; else fieldInvalid("f-phone", false);
        }
        var ch = hasE && hasP ? "both" : hasP ? "whatsapp" : "email";

        var party = formCtx.adults + formCtx.children;
        var left = ev.capacity - (ev.booked + mySeats(ev.id, formCtx.rsvpId || undefined));
        var perr = $("party-err");
        if (party < 1) {
          perr.textContent = "Please add at least 1 person.";
          perr.classList.add("show"); ok = false;
        } else if (party > left) {
          perr.textContent = "Only " + left + " spot" + (left === 1 ? "" : "s") + " left for this event — please reduce your party size.";
          perr.classList.add("show"); ok = false;
        } else {
          perr.classList.remove("show");
        }
        if (!ok) { toast("Please fix the highlighted fields."); return; }

        // duplicate guard: same email or same WhatsApp number already RSVP'd to this event
        var dup = myRsvps.filter(function (r) {
          if (r.eventId !== ev.id || r.id === formCtx.rsvpId) return false;
          if (hasE && r.email && r.email.toLowerCase() === email.toLowerCase()) return true;
          if (hasP && r.phone && r.phone.replace(/\D/g, "") === phoneDigits) return true;
          return false;
        })[0];
        if (dup) {
          toast("This email or WhatsApp number already has an RSVP for this event — find it under My RSVPs.");
          renderMine();
          show("mine");
          return;
        }

        var saved;
        if (formCtx.rsvpId) {
          saved = myRsvps.filter(function (r) { return r.id === formCtx.rsvpId; })[0];
          saved.name = name; saved.channel = ch; saved.email = email; saved.phone = phone;
          saved.adults = formCtx.adults; saved.children = formCtx.children; saved.comment = comment;
        } else {
          saved = {
            id: "r" + (seq++), eventId: ev.id, name: name, channel: ch,
            email: email, phone: phone,
            adults: formCtx.adults, children: formCtx.children, comment: comment
          };
          myRsvps.push(saved);
        }
        updateMineCount();
        renderEvents();
        renderConfirm(saved, !!formCtx.rsvpId);
      }

      /* ---------------- confirmation ---------------- */
      function renderConfirm(r, wasEdit) {
        var ev = eventById(r.eventId);
        var html =
          '<div class="panel confirm">' +
            '<div class="tick" aria-hidden="true">✓</div>' +
            '<h2>' + (wasEdit ? "RSVP updated" : "You\u2019re on the list!") + '</h2>' +
            '<p class="sub" style="margin-bottom:0;">Thank you, ' + esc(r.name.split(" ")[0]) + '.</p>' +
            '<div class="sent">' + sentLine(r) + '<br /><span style="color:var(--ink-soft); font-size:14.5px;">Tap that link any time to change your headcount or cancel.</span></div>' +
            '<dl>' +
              '<dt>Event</dt><dd>' + esc(ev.title) + '</dd>' +
              '<dt>When</dt><dd>' + esc(ev.dateLabel) + ', ' + esc(ev.time) + '</dd>' +
              '<dt>Party</dt><dd>' + r.adults + ' adult' + (r.adults === 1 ? "" : "s") + (r.children ? ' · ' + r.children + ' child' + (r.children === 1 ? "" : "ren") : "") + '</dd>' +
              '<dt>Confirmation via</dt><dd>' + contactLabel(r) + '</dd>' +
              (r.comment ? '<dt>Comment</dt><dd>' + esc(r.comment) + '</dd>' : '') +
            '</dl>' +
            '<div class="actions">' +
              '<button class="btn btn-primary" data-act="go-mine">View My RSVPs</button>' +
              '<button class="btn btn-quiet" data-act="back-events">More events</button>' +
            '</div>' +
          '</div>';
        $("view-confirm").innerHTML = html;
        show("confirm");
      }

      /* ---------------- my RSVPs ---------------- */
      function renderMine() {
        var box = $("view-mine");
        if (myRsvps.length === 0) {
          box.innerHTML =
            '<div class="empty"><p class="big">No RSVPs yet</p>' +
            '<p>When you RSVP for a Swamivatsalya, it will show up here so you can change your headcount or cancel.</p>' +
            '<button class="btn btn-primary" data-act="back-events">Browse events</button></div>';
          return;
        }
        var html = "";
        myRsvps.forEach(function (r) {
          var ev = eventById(r.eventId);
          html += '<article class="rsvp-card">' +
            '<h3>' + esc(ev.title) + '</h3>' +
            '<p class="meta">' + esc(ev.dateLabel) + ' · ' + esc(ev.time) + ' · ' + esc(ev.place) + '</p>' +
            '<div class="kv">' +
              '<span><b>' + esc(r.name) + '</b></span>' +
              '<span>' + r.adults + ' adult' + (r.adults === 1 ? "" : "s") + (r.children ? ' · ' + r.children + ' child' + (r.children === 1 ? "" : "ren") : "") + '</span>' +
              (hasEmail(r) ? '<span class="chan-badge email">Email: ' + esc(maskEmail(r.email)) + '</span>' : '') +
              (hasPhone(r) ? '<span class="chan-badge whatsapp">WhatsApp: ' + esc(maskPhone(r.phone)) + '</span>' : '') +
            '</div>' +
            (r.comment ? '<p class="meta">“' + esc(r.comment) + '”</p>' : '') +
            '<div class="actions">' +
              '<button class="btn btn-ghost" data-act="edit" data-id="' + r.id + '">Modify</button>' +
              '<button class="btn btn-danger" data-act="cancel-ask" data-id="' + r.id + '">Cancel RSVP</button>' +
            '</div>' +
            '<div class="cancel-box" id="cancel-' + r.id + '" hidden>' +
              '<p>Cancel this RSVP? Your ' + (r.adults + r.children) + ' spot' + (r.adults + r.children === 1 ? "" : "s") + ' will be released for others.</p>' +
              '<div class="row">' +
                '<button class="btn btn-danger" data-act="cancel-yes" data-id="' + r.id + '">Yes, cancel it</button>' +
                '<button class="btn btn-quiet" data-act="cancel-no" data-id="' + r.id + '">Keep my RSVP</button>' +
              '</div>' +
            '</div>' +
          '</article>';
        });
        box.innerHTML = html;
      }

      /* ---------------- events wiring ---------------- */
      document.addEventListener("click", function (e) {
        var t = e.target.closest("[data-act]");
        if (e.target === $("tab-events")) { renderEvents(); show("events"); return; }
        if (e.target === $("tab-mine")) { renderMine(); show("mine"); return; }
        if (!t) return;
        var act = t.getAttribute("data-act");
        var id = t.getAttribute("data-id");
        if (act === "rsvp") openForm(id, null);
        else if (act === "edit") {
          var r = myRsvps.filter(function (x) { return x.id === id; })[0];
          if (r) openForm(r.eventId, r.id);
        }
        else if (act === "back-events") { renderEvents(); show("events"); }
        else if (act === "go-mine") { renderMine(); show("mine"); }
        else if (act === "step") {
          var who = t.getAttribute("data-who"), d = parseInt(t.getAttribute("data-d"), 10);
          if (who === "adults") formCtx.adults = Math.max(0, Math.min(20, formCtx.adults + d));
          else formCtx.children = Math.max(0, Math.min(20, formCtx.children + d));
          syncSteppers();
        }
        else if (act === "submit") submitForm();
        else if (act === "cancel-ask") { var b = $("cancel-" + id); if (b) b.hidden = false; }
        else if (act === "cancel-no") { var b2 = $("cancel-" + id); if (b2) b2.hidden = true; }
        else if (act === "cancel-yes") {
          myRsvps = myRsvps.filter(function (x) { return x.id !== id; });
          updateMineCount(); renderEvents(); renderMine();
          toast("RSVP cancelled — your spots were released.");
        }
      });

      renderEvents();
      updateMineCount();
      show("events");
    </script>
  </body>
</html>
