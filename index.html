<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="description" content="JCGS Swamivatsalya RSVP — one permanent place to RSVP a headcount for the community meal. No accounts, no passwords." />
    <link rel="icon" href="icon-180.png" />
    <link rel="apple-touch-icon" href="icon-180.png" />
    <title>JCGS Swamivatsalya RSVP</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Lora:wght@500;600;700&family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <style>
      :root {
        --bg: #faf7f2;
        --surface: #ffffff;
        --surface-2: #f3ede3;
        --ink: #2b2118;
        --ink-soft: #5d5142;
        --ink-faint: #8a7c68;
        --line: #e2d8c8;
        --maroon: #7c2128;
        --maroon-deep: #5f161d;
        --maroon-soft: #f7e9e7;
        --gold: #b07d1e;
        --gold-soft: #f6ecd4;
        --green: #2e6b34;
        --green-soft: #e4efe1;
        --wa: #1f7a4d;
        --wa-soft: #e2f2e8;
        --danger: #a02c22;
        --danger-soft: #f9e7e4;
        --shadow: 0 1px 2px rgba(60, 40, 10, .06), 0 8px 24px rgba(60, 40, 10, .07);
        --radius: 14px;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #171310;
          --surface: #221c17;
          --surface-2: #2b241d;
          --ink: #f0e8dc;
          --ink-soft: #c9bba6;
          --ink-faint: #978a76;
          --line: #3d332a;
          --maroon: #e08a90;
          --maroon-deep: #eda6ab;
          --maroon-soft: #3a2226;
          --gold: #d9a94e;
          --gold-soft: #38301d;
          --green: #8fce97;
          --green-soft: #22331f;
          --wa: #7fd6a4;
          --wa-soft: #1e3328;
          --danger: #ef9a8f;
          --danger-soft: #3a2320;
          --shadow: 0 1px 2px rgba(0,0,0,.35), 0 8px 24px rgba(0,0,0,.3);
        }
      }
      * { box-sizing: border-box; }
      html { -webkit-text-size-adjust: 100%; }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font-family: "Public Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
        font-size: 17px;
        line-height: 1.5;
      }
      .wrap { max-width: 720px; margin: 0 auto; padding: 0 16px 56px; }
      header.top { padding: 28px 0 6px; text-align: center; }
      header.top .logo { display: block; width: 84px; height: 84px; margin: 0 auto 10px; border-radius: 50%; object-fit: cover; background: #fff; box-shadow: 0 1px 2px rgba(60, 40, 10, .15), 0 6px 18px rgba(60, 40, 10, .12); }
      header.top h1 {
        font-family: "Lora", Georgia, serif;
        font-size: 30px; font-weight: 700; line-height: 1.15;
        margin: 0 0 4px;
      }
      header.top .org { color: var(--ink-soft); font-size: 15px; margin: 0; }
      .mode-tag {
        display: inline-block; margin-top: 10px;
        font-size: 12.5px; font-weight: 700; letter-spacing: .04em;
        padding: 3px 10px; border-radius: 999px;
        border: 1px solid var(--gold); color: var(--gold); background: var(--gold-soft);
      }
      .mode-tag.live { border-color: var(--green); color: var(--green); background: var(--green-soft); }
      .mode-note {
        max-width: 560px; margin: 12px auto 0;
        font-size: 14.5px; color: var(--ink-soft); line-height: 1.55;
      }
      nav.tabs {
        display: flex; gap: 8px;
        margin: 22px 0 20px;
        background: var(--surface-2);
        border: 1px solid var(--line);
        border-radius: 999px;
        padding: 5px;
        position: sticky; top: 10px; z-index: 20;
      }
      nav.tabs button {
        flex: 1; appearance: none; border: 0; cursor: pointer;
        background: transparent; color: var(--ink-soft);
        font: inherit; font-weight: 600; font-size: 16px;
        padding: 10px 8px; border-radius: 999px;
      }
      nav.tabs button[aria-selected="true"] { background: var(--maroon); color: #fff; }
      @media (prefers-color-scheme: dark) {
        nav.tabs button[aria-selected="true"] { background: var(--maroon-soft); color: var(--maroon-deep); box-shadow: inset 0 0 0 1.5px var(--maroon); }
      }
      nav.tabs .count {
        display: inline-block; min-width: 22px; text-align: center;
        background: var(--gold); color: #fff;
        font-size: 13px; font-weight: 700;
        border-radius: 999px; padding: 0 6px; margin-left: 6px; vertical-align: 1px;
      }
      .refresh-row { display: flex; justify-content: flex-end; margin: -6px 0 14px; }
      .refresh-row button {
        appearance: none; background: none; border: 0; cursor: pointer;
        font: inherit; font-size: 15px; font-weight: 600; color: var(--maroon); padding: 6px 2px;
      }
      .event {
        background: var(--surface); border: 1px solid var(--line);
        border-radius: var(--radius); box-shadow: var(--shadow);
        padding: 18px; margin-bottom: 16px; display: flex; gap: 16px;
      }
      .datebox {
        flex: 0 0 64px; text-align: center;
        border: 1.5px solid var(--line); border-radius: 10px;
        padding: 8px 0 6px; background: var(--surface-2); height: fit-content;
      }
      .datebox .dow { font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--maroon); }
      .datebox .day { font-family: "Lora", Georgia, serif; font-size: 28px; font-weight: 700; line-height: 1.1; }
      .datebox .mon { font-size: 13px; color: var(--ink-soft); font-weight: 600; }
      .event .body { flex: 1; min-width: 0; }
      .event h2, .panel h2 {
        font-family: "Lora", Georgia, serif;
        font-size: 20px; font-weight: 600; line-height: 1.25; margin: 0 0 6px;
      }
      .meta { color: var(--ink-soft); font-size: 15px; margin: 0 0 2px; }
      .meta b { color: var(--ink); font-weight: 600; }
      .spots { margin-top: 12px; }
      .spots .nums { display: flex; justify-content: space-between; font-size: 14px; color: var(--ink-soft); margin-bottom: 5px; }
      .spots .nums b { color: var(--ink); }
      .bar { height: 8px; border-radius: 999px; background: var(--surface-2); border: 1px solid var(--line); overflow: hidden; }
      .bar i { display: block; height: 100%; background: var(--gold); border-radius: 999px; }
      .bar i.low { background: var(--danger); }
      .spots-left { font-weight: 700; color: var(--green); }
      .spots-left.low { color: var(--danger); }
      .full-tag, .mine-tag {
        display: inline-block; font-weight: 700; font-size: 14px;
        padding: 4px 12px; border-radius: 999px; margin-top: 12px;
      }
      .full-tag { color: var(--danger); background: var(--danger-soft); }
      .mine-tag { color: var(--green); background: var(--green-soft); }
      .btn {
        appearance: none; cursor: pointer; font: inherit; font-weight: 700;
        border-radius: 10px; border: 1.5px solid transparent;
        padding: 12px 20px; font-size: 16px;
        display: inline-block; text-align: center; text-decoration: none;
      }
      .btn-primary { background: var(--maroon); color: #fff; }
      .btn-primary:active { background: var(--maroon-deep); }
      @media (prefers-color-scheme: dark) {
        .btn-primary { background: var(--maroon-soft); color: var(--maroon-deep); border-color: var(--maroon); }
      }
      .btn-ghost { background: transparent; color: var(--maroon); border-color: var(--maroon); }
      .btn-quiet { background: var(--surface-2); color: var(--ink); border-color: var(--line); }
      .btn-danger { background: transparent; color: var(--danger); border-color: var(--danger); }
      .btn[disabled] { opacity: .45; cursor: not-allowed; }
      .btn-block { display: block; width: 100%; }
      .event .actions { margin-top: 14px; display: flex; gap: 10px; flex-wrap: wrap; }
      .event .actions .btn { padding: 10px 18px; }
      .panel {
        background: var(--surface); border: 1px solid var(--line);
        border-radius: var(--radius); box-shadow: var(--shadow); padding: 20px 18px;
      }
      .backlink {
        appearance: none; background: none; border: 0; cursor: pointer;
        font: inherit; font-weight: 600; color: var(--maroon); padding: 4px 0; margin-bottom: 10px;
      }
      .panel .sub { color: var(--ink-soft); margin: 0 0 18px; font-size: 15.5px; }
      .field { margin-bottom: 18px; }
      .field label, .field .lab { display: block; font-weight: 600; font-size: 15.5px; margin-bottom: 7px; }
      .field .hint { font-weight: 400; color: var(--ink-faint); font-size: 14px; }
      .field input[type="text"], .field input[type="email"], .field input[type="tel"], .field textarea {
        width: 100%; font: inherit; font-size: 17px; padding: 12px 13px;
        border: 1.5px solid var(--line); border-radius: 10px; background: var(--bg); color: var(--ink);
      }
      .field input:focus, .field textarea:focus { outline: 2px solid var(--gold); outline-offset: 1px; border-color: var(--gold); }
      .field input:disabled { background: var(--surface-2); color: var(--ink-faint); cursor: not-allowed; opacity: .7; }
      .field.is-disabled label { color: var(--ink-faint); }
      .field textarea { resize: vertical; min-height: 74px; }
      .field .err { display: none; color: var(--danger); font-size: 14.5px; font-weight: 600; margin-top: 6px; }
      .field.invalid input { border-color: var(--danger); }
      .field.invalid .err { display: block; }
      .stepper { display: flex; align-items: center; gap: 14px; }
      .stepper button {
        appearance: none; cursor: pointer; width: 46px; height: 46px; border-radius: 50%;
        border: 1.5px solid var(--maroon); background: var(--surface);
        color: var(--maroon); font-size: 24px; font-weight: 700; line-height: 1;
        display: grid; place-items: center;
      }
      .stepper button[disabled] { opacity: .35; cursor: not-allowed; }
      .stepper .val { font-size: 22px; font-weight: 700; min-width: 30px; text-align: center; }
      .stepper .who { color: var(--ink-soft); font-size: 15px; }
      .party-err { display: none; color: var(--danger); font-size: 14.5px; font-weight: 600; margin-top: 6px; }
      .party-err.show { display: block; }
      .form-note {
        background: var(--gold-soft); border: 1px solid var(--gold);
        border-radius: 10px; padding: 12px 14px; font-size: 15px; margin-bottom: 18px;
      }
      .form-note button.linklike {
        appearance: none; background: none; border: 0; padding: 0;
        font: inherit; font-weight: 700; color: var(--maroon);
        text-decoration: underline; cursor: pointer;
      }
      .confirm { text-align: center; padding: 30px 22px; }
      .confirm .tick {
        width: 66px; height: 66px; margin: 0 auto 14px; border-radius: 50%;
        background: var(--green-soft); display: grid; place-items: center;
        color: var(--green); font-size: 34px; font-weight: 700;
      }
      .confirm .sent {
        background: var(--surface-2); border: 1px solid var(--line);
        border-radius: 10px; padding: 13px 15px; margin: 16px 0; font-size: 16px;
      }
      .confirm dl {
        text-align: left; margin: 0 auto 20px; max-width: 420px;
        display: grid; grid-template-columns: auto 1fr; gap: 5px 16px; font-size: 16px;
      }
      .confirm dt { color: var(--ink-soft); font-weight: 600; }
      .confirm dd { margin: 0; font-weight: 600; }
      .confirm .actions { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
      .rsvp-card {
        background: var(--surface); border: 1px solid var(--line);
        border-radius: var(--radius); box-shadow: var(--shadow); padding: 18px; margin-bottom: 16px;
      }
      .rsvp-card h3 {
        font-family: "Lora", Georgia, serif; font-size: 19px; font-weight: 600;
        margin: 0 0 4px; line-height: 1.3;
      }
      .kv { display: flex; flex-wrap: wrap; gap: 6px 18px; font-size: 15.5px; margin-bottom: 12px; }
      .kv span b { font-weight: 700; }
      .chan-badge {
        display: inline-block; font-size: 13.5px; font-weight: 700;
        padding: 3px 10px; border-radius: 999px;
      }
      .chan-badge.email { color: var(--maroon); background: var(--maroon-soft); }
      .chan-badge.whatsapp { color: var(--wa); background: var(--wa-soft); }
      .rsvp-card .actions { display: flex; gap: 10px; flex-wrap: wrap; }
      .rsvp-card .actions .btn { padding: 9px 16px; font-size: 15px; }
      .cancel-box {
        margin-top: 12px; background: var(--danger-soft);
        border: 1px solid var(--danger); border-radius: 10px; padding: 13px 14px;
      }
      .cancel-box p { margin: 0 0 10px; font-size: 15.5px; }
      .cancel-box .row { display: flex; gap: 10px; flex-wrap: wrap; }
      .cancel-box .btn { padding: 8px 15px; font-size: 15px; }
      .empty {
        text-align: center; padding: 44px 20px;
        background: var(--surface); border: 1px dashed var(--line);
        border-radius: var(--radius); color: var(--ink-soft);
      }
      .empty .big { font-family: "Lora", Georgia, serif; font-size: 21px; color: var(--ink); margin: 0 0 6px; }
      .empty p { margin: 0 0 16px; }
      .alert {
        background: var(--danger-soft); border: 1px solid var(--danger);
        border-radius: 10px; padding: 13px 15px; font-size: 15.5px; margin-bottom: 16px;
      }
      .loading { text-align: center; color: var(--ink-soft); padding: 36px 12px; }
      footer.note { margin-top: 30px; text-align: center; color: var(--ink-faint); font-size: 13.5px; line-height: 1.55; }
      .toast {
        position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%) translateY(20px);
        background: var(--ink); color: var(--bg);
        padding: 12px 20px; border-radius: 999px; font-weight: 600; font-size: 15.5px;
        opacity: 0; pointer-events: none; transition: opacity .25s, transform .25s;
        max-width: calc(100vw - 32px); text-align: center; z-index: 50; box-shadow: var(--shadow);
      }
      .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
      [hidden] { display: none !important; }
      @media (max-width: 480px) {
        .event { flex-direction: column; gap: 12px; }
        .datebox { display: flex; align-items: baseline; gap: 8px; padding: 6px 12px; width: fit-content; }
        .datebox .day { font-size: 22px; }
        header.top h1 { font-size: 26px; }
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <header class="top">
        <img class="logo" src="icon-180.png" alt="Jain Center of Greater Sacramento logo" />
        <h1>Swamivatsalya RSVP</h1>
        <p class="org">Jain Center of Greater Sacramento</p>
        <span class="mode-tag" id="mode-tag">DEMO MODE</span>
        <p class="mode-note" id="mode-note"></p>
      </header>

      <nav class="tabs" role="tablist" aria-label="App sections">
        <button id="tab-events" role="tab" aria-selected="true">Events</button>
        <button id="tab-mine" role="tab" aria-selected="false">My RSVPs<span class="count" id="mine-count" hidden>0</span></button>
      </nav>

      <section id="view-events" aria-label="Upcoming events"></section>
      <section id="view-form" hidden aria-label="RSVP form"></section>
      <section id="view-confirm" hidden aria-label="Confirmation"></section>
      <section id="view-mine" hidden aria-label="My RSVPs"></section>
      <section id="view-announce" aria-label="New event email signup"></section>

      <footer class="note" id="footer-note"></footer>
    </div>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <script>
      "use strict";

      /* ============================================================
       * CONFIG — the one line that makes this app live.
       *
       * 1. Deploy Code.gs (backend-starter-2026-10-26) under the
       *    TEMPLE Google Workspace account as a Web App
       *    (Execute as Me, access Anyone) and copy its /exec URL.
       * 2. Paste that URL below, replacing the empty string.
       * 3. Upload this file as index.html to the SEPARATE repo
       *    jcgs-swamivatsalya-rsvp (NOT the jcgs-live repo).
       *
       * While API_URL is empty, the app runs in clearly-labelled
       * DEMO MODE: sample events, RSVPs stored only in this
       * browser (localStorage), nothing sent or shared, nothing
       * written to any Sheet. Demo mode is for testing the screens,
       * never for a real event.
       * ============================================================ */
      var API_URL = "https://script.google.com/macros/s/AKfycbz2dUI_KYgmRH1tdAl3nFWsJ66YwhJ8sD3q-2wfHgmCTxfUrT7jHbWwOAhEYq37lnJP/exec";
      var DEMO_MODE = !API_URL;

      /* ---------------- storage keys (this device only) ---------------- */
      var TOKENS_KEY = "jcgs.rsvp.tokens.v1";
      var DETAILS_KEY = "jcgs.rsvp.details.v1";
      var DEMO_KEY = "jcgs.rsvp.demo.v1";
      var SUB_KEY = "jcgs.rsvp.subscribed.v1";

      /* ---------------- state ---------------- */
      var EVENTS = []; // normalized events
      var MY = [];     // merged own RSVPs: {rsvp_id, event_id, token, title, dateLabel, start_time, place, adults, children, comment, name, email, phone}
      var formCtx = null; // {eventId, rsvpId|null, adults, children}
      var lastSaved = null; // last created/updated RSVP, for the confirmation screen

      /* ---------------- helpers ---------------- */
      function $(id) { return document.getElementById(id); }
      function esc(s) {
        return String(s == null ? "" : s)
          .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
      }
      function loadJson(key, fallback) {
        try { var v = JSON.parse(localStorage.getItem(key) || "null"); return v == null ? fallback : v; }
        catch (e) { return fallback; }
      }
      function saveJson(key, value) { try { localStorage.setItem(key, JSON.stringify(value)); } catch (e) {} }
      /* Fast open: keep the last good events / My RSVPs on this device
         so the page can show them instantly, then refresh in the
         background. Counts are always re-checked live before anything
         is submitted, and capacity is enforced by the backend, so a
         briefly stale cached count can never overbook. */
      var EVENTS_CACHE_KEY = "jcgs.rsvp.eventsCache.v1";
      var MINE_CACHE_KEY = "jcgs.rsvp.mineCache.v1";
      var CACHE_MAX_AGE_MS = 7 * 24 * 60 * 60 * 1000;
      function getCache(key) {
        try {
          var v = JSON.parse(localStorage.getItem(key) || "null");
          if (v && v.data && (Date.now() - Number(v.t || 0)) < CACHE_MAX_AGE_MS) return v.data;
        } catch (e) {}
        return null;
      }
      function setCache(key, data) { try { localStorage.setItem(key, JSON.stringify({ t: Date.now(), data: data })); } catch (e) {} }
      function applyEvents_(raw) {
        var today = new Date(); today.setHours(0, 0, 0, 0);
        EVENTS = (raw || []).map(normEvent).filter(function (ev) {
          return !ev.dateObj || ev.dateObj.getTime() >= today.getTime();
        }).sort(function (a, b) {
          return (a.dateObj ? a.dateObj.getTime() : 0) - (b.dateObj ? b.dateObj.getTime() : 0);
        });
      }
      function getTokens() { return loadJson(TOKENS_KEY, []); }
      function addToken(t) {
        if (!t) return;
        var list = getTokens();
        if (list.indexOf(t) === -1) { list.push(t); saveJson(TOKENS_KEY, list); }
      }
      function getDetails() { return loadJson(DETAILS_KEY, {}); }
      function saveDetail(rsvpId, detail) {
        var map = getDetails(); map[rsvpId] = detail; saveJson(DETAILS_KEY, map);
      }
      function dropDetail(rsvpId) {
        var map = getDetails(); delete map[rsvpId]; saveJson(DETAILS_KEY, map);
      }
      function savedContact() {
        // Most recent RSVP known on this device, or (once the backend
        // returns it) the most recent RSVP reached via a manage link.
        // Used only to prefill a NEW form; nothing is submitted
        // automatically, and the headcount still starts fresh.
        for (var i = MY.length - 1; i >= 0; i--) {
          var m = MY[i];
          if (m && m.name) return { name: m.name || "", email: m.email || "", phone: m.phone || "" };
        }
        var map = getDetails(); var keys = Object.keys(map);
        for (var j = keys.length - 1; j >= 0; j--) {
          var d = map[keys[j]];
          if (d && d.name) return { name: d.name || "", email: d.email || "", phone: d.phone || "" };
        }
        return null;
      }
      function clearSavedContact() {
        saveJson(DETAILS_KEY, {});
        MY.forEach(function (m) { m.name = ""; m.email = ""; m.phone = ""; });
      }
      function parseDate(v) {
        if (v == null || v === "") return null;
        // A bare YYYY-MM-DD from the Sheet must be read as a local
        // calendar date, not UTC midnight (which would show as the
        // previous day in Pacific time).
        if (typeof v === "string") {
          var m = /^(\d{4})-(\d{2})-(\d{2})/.exec(v);
          if (m) return new Date(Number(m[1]), Number(m[2]) - 1, Number(m[3]));
        }
        var d = v instanceof Date ? v : new Date(v);
        return isNaN(d.getTime()) ? null : d;
      }
      function fmtLong(d) {
        if (!d) return "";
        return d.toLocaleDateString("en-US", { weekday: "long", month: "long", day: "numeric", year: "numeric" });
      }
      function fmtShortParts(d) {
        if (!d) return { dow: "", day: "", mon: "" };
        return {
          dow: d.toLocaleDateString("en-US", { weekday: "short" }),
          day: String(d.getDate()),
          mon: d.toLocaleDateString("en-US", { month: "short" })
        };
      }
      function fmtTime(raw) { return String(raw == null ? "" : raw); }
      function normEvent(raw) {
        var d = parseDate(raw.date);
        var capacity = Number(raw.capacity || 0);
        var attending = Number(raw.attending || 0);
        var spots = raw.spots_left != null ? Number(raw.spots_left) : Math.max(0, capacity - attending);
        var closesRaw = String(raw.closes_at || "");
        var closesDate = closesRaw ? parseDate(closesRaw) : null;
        var closesDisplay = closesDate ? fmtLong(closesDate) : closesRaw;
        return {
          event_id: String(raw.event_id || raw.id || ""),
          title: String(raw.title || ""),
          dateObj: d,
          dateLabel: d ? fmtLong(d) : String(raw.date || ""),
          start_time: fmtTime(raw.start_time),
          location: String(raw.location || raw.place || ""),
          capacity: capacity,
          attending: attending,
          spots_left: spots,
          closes_at: closesDisplay, note: String(raw.note || "")
        };
      }
      function eventById(id) {
        for (var i = 0; i < EVENTS.length; i++) if (EVENTS[i].event_id === id) return EVENTS[i];
        return null;
      }
      function myForEvent(eventId) {
        for (var i = 0; i < MY.length; i++) if (MY[i].event_id === eventId) return MY[i];
        return null;
      }
      function maskEmail(email) {
        var parts = String(email || "").split("@");
        if (parts.length !== 2) return email;
        var local = parts[0];
        var shown = local.length <= 2 ? local.charAt(0) + "•" : local.charAt(0) + "•••" + local.charAt(local.length - 1);
        return shown + "@" + parts[1];
      }
      function maskPhone(phone) {
        var digits = String(phone || "").replace(/\D/g, "");
        return "•••" + (digits.slice(-4) ? " " + digits.slice(-4) : "");
      }
      function hasEmail(r) { return !!(r.email && String(r.email).trim()); }
      function hasPhone(r) { return !!(r.phone && String(r.phone).trim()); }
      function contactLabel(r) {
        if (hasEmail(r) && hasPhone(r)) return "Email & WhatsApp";
        if (hasPhone(r)) return "WhatsApp";
        return "Email";
      }
      var toastTimer = null;
      function toast(msg) {
        var t = $("toast");
        t.textContent = msg;
        t.classList.add("show");
        if (toastTimer) clearTimeout(toastTimer);
        toastTimer = setTimeout(function () { t.classList.remove("show"); }, 3200);
      }

      /* ---------------- backend API (live mode) ---------------- */
      // Simple requests only (no custom headers) so the Apps Script
      // endpoint can answer without a CORS preflight.
      function apiGet(action, params) {
        var q = "?action=" + encodeURIComponent(action);
        if (params) {
          Object.keys(params).forEach(function (k) { q += "&" + encodeURIComponent(k) + "=" + encodeURIComponent(params[k]); });
        }
        return fetch(API_URL + q).then(function (res) { return res.json(); });
      }
      function apiPost(body) {
        return fetch(API_URL, {
          method: "POST",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify(body)
        }).then(function (res) { return res.json(); });
      }

      /* ---------------- demo data (DEMO MODE only) ---------------- */
      function demoEvents() {
        // Dates relative to today so the demo never goes stale.
        function plus(days, hour) {
          var d = new Date(); d.setDate(d.getDate() + days); d.setHours(hour || 12, 30, 0, 0);
          return d.toISOString();
        }
        var raw = [
          { event_id: "sample-1", title: "Sunday Swamivatsalya (sample)", date: plus(2), start_time: "12:30 PM", location: "JCGS Temple Hall", capacity: 60, attending: 60, closes_at: "", note: "" },
          { event_id: "sample-2", title: "Sunday Swamivatsalya (sample)", date: plus(9), start_time: "12:30 PM", location: "JCGS Temple Hall", capacity: 180, attending: 171, closes_at: "", note: "" },
          { event_id: "sample-3", title: "Sunday Swamivatsalya (sample)", date: plus(16), start_time: "12:30 PM", location: "JCGS Temple Hall", capacity: 180, attending: 96, closes_at: "", note: "" }
        ];
        // Demo RSVPs add to the attending count, like the live backend does.
        var mine = loadJson(DEMO_KEY, []);
        raw.forEach(function (ev) {
          mine.forEach(function (r) { if (r.event_id === ev.event_id) ev.attending += r.adults + r.children; });
        });
        return raw.map(normEvent);
      }
      function demoMy() {
        var mine = loadJson(DEMO_KEY, []);
        return mine.map(function (r) {
          var ev = eventById(r.event_id);
          return {
            rsvp_id: r.rsvp_id, event_id: r.event_id, token: r.token,
            title: ev ? ev.title : "", dateLabel: ev ? ev.dateLabel : "",
            start_time: ev ? ev.start_time : "", place: ev ? ev.location : "",
            adults: r.adults, children: r.children, comment: r.comment,
            name: r.name, email: r.email, phone: r.phone
          };
        });
      }

      /* ---------------- load ---------------- */
      function loadFromHash() {
        // Unsubscribe links from announcement emails point here as #unsubscribe=<token>.
        var u = /#unsubscribe=([A-Za-z0-9]+)/.exec(location.hash || "");
        if (u) {
          try { history.replaceState(null, "", location.pathname + location.search); } catch (e) {}
          if (!DEMO_MODE) unsubscribeAnnounce(u[1]);
          return false;
        }
        // Manage links from email point here as #token=<token>.
        var m = /#token=([A-Za-z0-9]+)/.exec(location.hash || "");
        if (m) {
          addToken(m[1]);
          try { history.replaceState(null, "", location.pathname + location.search); } catch (e) {}
          return true;
        }
        return false;
      }
      function loadAll() {
        var openedViaLink = loadFromHash();
        if (DEMO_MODE) {
          EVENTS = demoEvents();
          MY = demoMy();
          renderAll();
          if (openedViaLink) show("mine");
          return Promise.resolve();
        }
        $("view-events").innerHTML = '<p class="loading">Loading events…</p>';
        // Fast open: if this device has a recent copy, show it at once
        // and refresh in the background instead of staring at
        // "Loading events…" for the ~4s each Apps Script call takes.
        var hadCache = false;
        var cachedEvents = getCache(EVENTS_CACHE_KEY);
        if (cachedEvents) {
          applyEvents_(cachedEvents);
          var cachedMine = getCache(MINE_CACHE_KEY);
          if (cachedMine) buildMine_(cachedMine);
          renderAll();
          hadCache = true;
          if (openedViaLink) show("mine");
        }
        // Start My RSVPs fetching in parallel with the events list so
        // the page does not wait for one slow call after another.
        var minePromise = loadMineRaw_().catch(function () { return []; });
        return apiGet("listEvents").then(function (data) {
          if (!data || !data.ok) throw new Error((data && data.error) || "Could not load events.");
          setCache(EVENTS_CACHE_KEY, data.events || []);
          applyEvents_(data.events);
          renderAll();
          return minePromise;
        }).then(function (parts) {
          setCache(MINE_CACHE_KEY, parts);
          buildMine_(parts);
          renderAll();
          if (openedViaLink) show("mine");
        }).catch(function (err) {
          // A cached copy is already on screen: keep it rather than
          // replacing it with an error when the refresh fails.
          if (hadCache) { renderAll(); return; }
          $("view-events").innerHTML =
            '<div class="alert"><b>Could not load events.</b><br />' + esc(err && err.message ? err.message : String(err)) +
            '<br />Check the connection, then try again.</div>' +
            '<button class="btn btn-primary btn-block" data-act="reload">Try again</button>';
          renderMine();
          updateMineCount();
        });
      }
      function loadMineRaw_() {
        var tokens = getTokens();
        return Promise.all(tokens.map(function (tok) {
          return apiGet("myRsvps", { token: tok }).then(function (data) {
            return { token: tok, rsvps: data.rsvps || [] };
          }).catch(function () { return { token: tok, rsvps: [] }; });
        }));
      }
      function buildMine_(parts) {
        var details = getDetails();
        var all = [];
        (parts || []).forEach(function (part) {
          (part.rsvps || []).forEach(function (r) {
            var ev = eventById(r.event_id);
            var d = details[r.rsvp_id] || {};
            var nm = r.name || d.name || "", em = r.email || d.email || "", ph = r.phone || d.phone || "";
            if (r.name) saveDetail(r.rsvp_id, { name: nm, email: em, phone: ph });
            all.push({
              rsvp_id: r.rsvp_id, event_id: r.event_id, token: part.token,
              title: r.title || (ev ? ev.title : ""), dateLabel: (function () { var dd = parseDate(r.date); return dd ? fmtLong(dd) : (ev ? ev.dateLabel : ""); })(),
              start_time: ev ? ev.start_time : "", place: ev ? ev.location : "",
              adults: Number(r.adults || 0), children: Number(r.children || 0),
              comment: r.comment || "", name: nm, email: em, phone: ph
            });
          });
        });
        MY = all;
      }
      function loadMineLive() {
        return loadMineRaw_().then(buildMine_);
      }

      /* ---------------- new-event email announcements ---------------- */
      function renderAnnounce() {
        var el = $("view-announce");
        if (DEMO_MODE) { el.hidden = true; el.innerHTML = ""; return; }
        var sub = loadJson(SUB_KEY, null);
        el.hidden = false;
        if (sub && sub.email) {
          el.innerHTML =
            '<div class="panel">' +
              '<h2>Get notified about new events</h2>' +
              '<p class="sub">You\u2019re signed up for new-event emails at ' + esc(sub.email) + '. You\u2019ll get one email when a new Swamivatsalya is posted.</p>' +
              '<button class="btn btn-ghost" data-act="unsub">Unsubscribe</button>' +
            '</div>';
        } else {
          el.innerHTML =
            '<div class="panel">' +
              '<h2>Get notified about new events</h2>' +
              '<p class="sub">One email when a new Swamivatsalya is posted. No other emails from this signup.</p>' +
              '<div class="field">' +
                '<label for="in-announce-email">Email address</label>' +
                '<input type="email" id="in-announce-email" autocomplete="email" inputmode="email" placeholder="you@example.com" />' +
              '</div>' +
              '<button class="btn btn-primary btn-block" data-act="subscribe">Notify me about new events</button>' +
            '</div>';
        }
      }
      function subscribeAnnounce() {
        var inp = $("in-announce-email");
        var email = inp ? inp.value.trim() : "";
        if (!email || email.indexOf("@") < 0) { toast("Enter an email address to sign up."); return; }
        apiPost({ action: "subscribe", email: email }).then(function (data) {
          if (!data || !data.ok) throw new Error((data && data.error) || "Could not sign up.");
          saveJson(SUB_KEY, { email: email, token: data.token || "" });
          renderAnnounce();
          toast("You\u2019re signed up for new-event emails.");
        }).catch(function (e) { toast(e.message || String(e)); });
      }
      function unsubscribeAnnounce(token) {
        var sub = loadJson(SUB_KEY, null);
        var tok = token || (sub && sub.token) || "";
        if (!tok) { saveJson(SUB_KEY, null); renderAnnounce(); toast("You\u2019ve been unsubscribed from new-event emails."); return; }
        apiPost({ action: "unsubscribe", token: tok }).then(function () {
          saveJson(SUB_KEY, null);
          renderAnnounce();
          toast("You\u2019ve been unsubscribed from new-event emails.");
        }).catch(function (e) { toast(e.message || String(e)); });
      }

      /* ---------------- view switching ---------------- */
      var VIEWS = ["events", "form", "confirm", "mine"];
      function show(view) {
        VIEWS.forEach(function (v) { $("view-" + v).hidden = v !== view; });
        var onEvents = view === "events" || view === "form" || view === "confirm";
        $("tab-events").setAttribute("aria-selected", onEvents ? "true" : "false");
        $("tab-mine").setAttribute("aria-selected", view === "mine" ? "true" : "false");
        window.scrollTo(0, 0);
      }
      function updateMineCount() {
        var c = $("mine-count");
        c.textContent = MY.length;
        c.hidden = MY.length === 0;
      }
      function renderAll() { renderEvents(); renderMine(); updateMineCount(); renderAnnounce(); }

      /* ---------------- events list (counts only — names never shown) ---------------- */
      function renderEvents() {
        if (EVENTS.length === 0) {
          $("view-events").innerHTML =
            '<div class="empty"><p class="big">No upcoming Swamivatsalya events</p>' +
            '<p>Please check back soon, or ask anyone from the AV team.</p></div>';
          return;
        }
        var html = '<div class="refresh-row"><button data-act="reload" type="button">Refresh counts</button></div>';
        EVENTS.forEach(function (ev) {
          var left = ev.spots_left;
          var pct = ev.capacity ? Math.min(100, Math.round(ev.attending / ev.capacity * 100)) : 0;
          var low = left > 0 && left <= 15;
          var parts = fmtShortParts(ev.dateObj);
          var mine = myForEvent(ev.event_id);
          html += '<article class="event">' +
            '<div class="datebox"><div class="dow">' + esc(parts.dow) + '</div><div class="day">' + esc(parts.day) + '</div><div class="mon">' + esc(parts.mon) + '</div></div>' +
            '<div class="body">' +
              '<h2>' + esc(ev.title) + '</h2>' +
              '<p class="meta"><b>' + esc(ev.start_time) + '</b> · ' + esc(ev.location) + '</p>' +
              '<p class="meta">' + esc(ev.dateLabel) + '</p>' +
              (ev.closes_at ? '<p class="meta">RSVP by ' + esc(ev.closes_at) + '</p>' : '') +
              (ev.note ? '<p class="meta">' + esc(ev.note) + '</p>' : '') +
              '<div class="spots"><div class="nums"><span><b>' + ev.attending + '</b> attending</span>' +
              (left > 0
                ? '<span class="spots-left' + (low ? " low" : "") + '">' + left + ' spots left</span>'
                : '<span class="spots-left low">Full</span>') +
              '</div><div class="bar"><i class="' + (low || left === 0 ? "low" : "") + '" style="width:' + pct + '%"></i></div></div>' +
              (mine
                ? '<span class="mine-tag">✓ You\u2019re RSVP\u2019d — ' + (mine.adults + mine.children) + ' in your party</span>'
                : (left === 0 ? '<span class="full-tag">This event is full</span>' : '')) +
              '<div class="actions">' +
                (mine
                  ? '<button class="btn btn-ghost" data-act="edit" data-id="' + mine.rsvp_id + '">Modify my RSVP</button>'
                  : '<button class="btn btn-primary" data-act="rsvp" data-id="' + ev.event_id + '"' + (left === 0 ? " disabled" : "") + '>RSVP</button>') +
              '</div>' +
            '</div></article>';
        });
        $("view-events").innerHTML = html;
      }

      /* ---------------- RSVP form ---------------- */
      function openForm(eventId, rsvpId) {
        var ev = eventById(eventId);
        if (!ev) return;
        var existing = rsvpId ? MY.filter(function (r) { return r.rsvp_id === rsvpId; })[0] : null;
        formCtx = { eventId: eventId, rsvpId: rsvpId || null, adults: existing ? existing.adults : 2, children: existing ? existing.children : 0 };
        var isEdit = !!existing;
        var saved = isEdit ? null : savedContact();
        var html =
          '<button class="backlink" data-act="back-events">← All events</button>' +
          '<div class="panel">' +
            '<h2>' + (isEdit ? "Modify your RSVP" : "RSVP") + ' — ' + esc(ev.title) + '</h2>' +
            '<p class="sub">' + esc(ev.dateLabel) + ' · ' + esc(ev.start_time) + ' · ' + esc(ev.location) + '<br />' +
            ev.spots_left + ' spots left · Headcount only, please</p>';

        if (isEdit) {
          html += '<div class="form-note">You are changing the headcount and comment only. Your name and contact details stay exactly as you gave them before.</div>';
        } else {
          html +=
            (saved ? '<div class="form-note">Filled in from your last RSVP \u2014 check it and edit if needed. <button type="button" class="linklike" data-act="clear-saved">Not you? Use different details.</button></div>' : "") +
            '<div class="field" id="f-name">' +
              '<label for="in-name">Your name</label>' +
              '<input type="text" id="in-name" autocomplete="name" placeholder="Full name" value="' + esc(saved ? saved.name : "") + '" />' +
              '<div class="err">Please enter your name.</div>' +
            '</div>' +
            '<div class="form-note"><b>How can we reach you?</b> Give your <b>email</b>. Your confirmation &amp; manage link will be sent to that email. WhatsApp messages are not sent yet, so the phone number field is turned off for now.</div>' +
            '<div class="field" id="f-email">' +
              '<label for="in-email">Email address <span class="hint">(required)</span></label>' +
              '<input type="email" id="in-email" autocomplete="email" inputmode="email" placeholder="you@example.com" value="' + esc(saved ? saved.email : "") + '" />' +
              '<div class="err">Please enter a valid email address.</div>' +
            '</div>' +
            '<div class="field is-disabled" id="f-phone">' +
              '<label for="in-phone">Mobile / WhatsApp number <span class="hint">(not available yet)</span></label>' +
              '<input type="tel" id="in-phone" autocomplete="tel" inputmode="tel" placeholder="WhatsApp coming soon" value="" disabled />' +
              '<div class="err">WhatsApp messages are not sent yet.</div>' +
            '</div>' +
            '<div class="party-err" id="contact-err" role="alert"></div>';
        }

        html +=
          '<div class="field">' +
            '<span class="lab">How many are coming?</span>' +
            '<div class="stepper" style="margin-bottom:12px;">' +
              '<button type="button" data-act="step" data-who="adults" data-d="-1" aria-label="Fewer adults">−</button>' +
              '<span class="val" id="val-adults">2</span>' +
              '<button type="button" data-act="step" data-who="adults" data-d="1" aria-label="More adults">+</button>' +
              '<span class="who">Adults</span>' +
            '</div>' +
            '<div class="stepper">' +
              '<button type="button" data-act="step" data-who="children" data-d="-1" aria-label="Fewer children">−</button>' +
              '<span class="val" id="val-children">0</span>' +
              '<button type="button" data-act="step" data-who="children" data-d="1" aria-label="More children">+</button>' +
              '<span class="who">Children</span>' +
            '</div>' +
            '<div class="party-err" id="party-err"></div>' +
          '</div>' +
          '<div class="field">' +
            '<label for="in-comment">Comment <span class="hint">(optional)</span></label>' +
            '<textarea id="in-comment" placeholder="Anything the organizers should know — seating needs, arriving late, etc.">' + esc(existing ? existing.comment : "") + '</textarea>' +
          '</div>' +
          '<button class="btn btn-primary btn-block" data-act="submit">' + (isEdit ? "Save changes" : "Confirm RSVP") + '</button>' +
        '</div>';
        $("view-form").innerHTML = html;
        syncSteppers();
        show("form");
      }
      function syncSteppers() {
        if (!formCtx) return;
        $("val-adults").textContent = formCtx.adults;
        $("val-children").textContent = formCtx.children;
        document.querySelectorAll("[data-act='step']").forEach(function (b) {
          var who = b.getAttribute("data-who"), d = parseInt(b.getAttribute("data-d"), 10);
          var v = who === "adults" ? formCtx.adults : formCtx.children;
          b.disabled = (d < 0 && v <= 0) || (d > 0 && v >= 20);
        });
      }
      function fieldInvalid(id, bad) { $(id).classList.toggle("invalid", !!bad); return !bad; }

      function submitForm() {
        var ev = eventById(formCtx.eventId);
        var isEdit = !!formCtx.rsvpId;
        var name = "", email = "", phone = "";
        var ok = true;
        if (!isEdit) {
          name = $("in-name").value.trim();
          email = $("in-email").value.trim();
          phone = ""; // Phone field is disabled until WhatsApp sending is enabled.
          ok = fieldInvalid("f-name", !name) && ok;
          var emailOk = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
          ok = fieldInvalid("f-email", !emailOk) && ok;
        }
        var party = formCtx.adults + formCtx.children;
        var existing = isEdit ? MY.filter(function (r) { return r.rsvp_id === formCtx.rsvpId; })[0] : null;
        var ownSeats = existing ? existing.adults + existing.children : 0;
        var left = ev.spots_left + ownSeats;
        var perr = $("party-err");
        if (party < 1) {
          perr.textContent = "Please add at least 1 person."; perr.classList.add("show"); ok = false;
        } else if (party > left) {
          perr.textContent = "Only " + left + " spot" + (left === 1 ? "" : "s") + " left for this event — please reduce your party size.";
          perr.classList.add("show"); ok = false;
        } else { perr.classList.remove("show"); }
        if (!ok) { toast("Please fix the highlighted fields."); return; }

        var comment = $("in-comment").value.trim();
        if (DEMO_MODE) { submitDemo(ev, existing, name, email, phone, comment); return; }
        submitLive(ev, existing, name, email, phone, comment);
      }

      function submitDemo(ev, existing, name, email, phone, comment) {
        var mine = loadJson(DEMO_KEY, []);
        if (!existing) {
          var phoneDigits = phone.replace(/\D/g, "");
          var dup = mine.filter(function (r) {
            if (r.event_id !== ev.event_id) return false;
            if (email && r.email && r.email.toLowerCase() === email.toLowerCase()) return true;
            if (phone && r.phone && r.phone.replace(/\D/g, "") === phoneDigits) return true;
            return false;
          })[0];
          if (dup) {
            dup.adults = formCtx.adults; dup.children = formCtx.children; dup.comment = comment;
            dup.name = name; dup.email = email; dup.phone = phone;
            saveJson(DEMO_KEY, mine);
            lastSaved = Object.assign({}, dup, { deduped: true });
            EVENTS = demoEvents(); MY = demoMy();
            renderAll(); renderConfirm(lastSaved, false, true);
            return;
          }
          var rec = {
            rsvp_id: "demo-" + Date.now().toString(36) + Math.floor(Math.random() * 1000),
            event_id: ev.event_id, token: "demo-" + Math.random().toString(36).slice(2),
            name: name, email: email, phone: phone,
            adults: formCtx.adults, children: formCtx.children, comment: comment
          };
          mine.push(rec); saveJson(DEMO_KEY, mine);
          lastSaved = rec;
        } else {
          mine.forEach(function (r) {
            if (r.rsvp_id === existing.rsvp_id) { r.adults = formCtx.adults; r.children = formCtx.children; r.comment = comment; }
          });
          saveJson(DEMO_KEY, mine);
          lastSaved = Object.assign({}, existing, { adults: formCtx.adults, children: formCtx.children, comment: comment });
        }
        EVENTS = demoEvents(); MY = demoMy();
        renderAll(); renderConfirm(lastSaved, !!existing, false);
      }

      function submitLive(ev, existing, name, email, phone, comment) {
        var btn = document.querySelector("[data-act='submit']");
        if (btn) { btn.disabled = true; btn.textContent = "Saving…"; }
        var done = function () { loadAll().then(function () { renderConfirm(lastSaved, !!existing, false); }); };
        if (existing) {
          apiPost({ action: "updateRsvp", token: existing.token, rsvp_id: existing.rsvp_id, adults: formCtx.adults, children: formCtx.children, comment: comment })
            .then(function (data) {
              if (!data || !data.ok) throw new Error((data && data.error) || "Could not save the change.");
              lastSaved = Object.assign({}, existing, { adults: formCtx.adults, children: formCtx.children, comment: comment });
              done();
            })
            .catch(function (err) { toast(err.message || String(err)); if (btn) { btn.disabled = false; btn.textContent = "Save changes"; } });
          return;
        }
        apiPost({ action: "createRsvp", event_id: ev.event_id, name: name, email: email, phone: phone, adults: formCtx.adults, children: formCtx.children, comment: comment })
          .then(function (data) {
            if (!data || !data.ok) throw new Error((data && data.error) || "Could not save the RSVP.");
            addToken(data.token);
            lastSaved = {
              rsvp_id: "", event_id: ev.event_id, token: data.token,
              name: name, email: email, phone: phone,
              adults: formCtx.adults, children: formCtx.children, comment: comment,
              deduped: !!data.deduped, message: data.message || ""
            };
            // Keep name/contact on this device only, so future RSVPs
            // can prefill them later. The Sheet is the source of truth.
            return loadAll().then(function () {
              var mine = myForEvent(ev.event_id);
              if (mine) { saveDetail(mine.rsvp_id, { name: name, email: email, phone: phone }); lastSaved.rsvp_id = mine.rsvp_id; }
              renderConfirm(lastSaved, false, false);
            });
          })
          .catch(function (err) { toast(err.message || String(err)); if (btn) { btn.disabled = false; btn.textContent = "Confirm RSVP"; } });
      }

      /* ---------------- confirmation ---------------- */
      function renderConfirm(r, wasEdit, deduped) {
        var ev = eventById(r.event_id);
        var sent;
        if (DEMO_MODE) {
          sent = "Demo mode — <b>nothing was sent or shared</b>. This RSVP is only on this device. " +
            "In live mode your confirmation &amp; manage link go to the contact you gave.";
        } else if (hasEmail(r) && hasPhone(r)) {
          sent = "Your confirmation &amp; manage link were sent by <b>Email</b> to <b>" + esc(maskEmail(r.email)) + "</b> and by <b>WhatsApp</b> to <b>" + esc(maskPhone(r.phone)) + "</b>.";
        } else if (hasPhone(r)) {
          sent = "Your confirmation &amp; manage link were sent by <b>WhatsApp</b> to <b>" + esc(maskPhone(r.phone)) + "</b>.";
        } else {
          sent = "Your confirmation &amp; manage link were sent by <b>Email</b> to <b>" + esc(maskEmail(r.email)) + "</b>.";
        }
        if (deduped || r.deduped) {
          sent += "<br />Your existing RSVP for this event was updated — it was not counted twice.";
        }
        var firstName = String(r.name || "").split(" ")[0];
        var html =
          '<div class="panel confirm">' +
            '<div class="tick" aria-hidden="true">✓</div>' +
            '<h2>' + (wasEdit ? "RSVP updated" : "You\u2019re on the list!") + '</h2>' +
            (firstName ? '<p class="sub" style="margin-bottom:0;">Thank you, ' + esc(firstName) + '.</p>' : '<p class="sub" style="margin-bottom:0;">Thank you.</p>') +
            '<div class="sent">' + sent + '<br /><span style="color:var(--ink-soft); font-size:14.5px;">Tap that link any time to change your headcount or cancel.</span></div>' +
            '<dl>' +
              '<dt>Event</dt><dd>' + esc(ev ? ev.title : "") + '</dd>' +
              '<dt>When</dt><dd>' + esc(ev ? ev.dateLabel : "") + (ev && ev.start_time ? ', ' + esc(ev.start_time) : "") + '</dd>' +
              '<dt>Party</dt><dd>' + r.adults + ' adult' + (r.adults === 1 ? "" : "s") + (r.children ? ' · ' + r.children + ' child' + (r.children === 1 ? "" : "ren") : "") + '</dd>' +
              '<dt>Confirmation via</dt><dd>' + (r.name || hasEmail(r) || hasPhone(r) ? contactLabel(r) : "Your contact details") + '</dd>' +
              (r.comment ? '<dt>Comment</dt><dd>' + esc(r.comment) + '</dd>' : '') +
            '</dl>' +
            '<div class="actions">' +
              '<button class="btn btn-primary" data-act="go-mine">View My RSVPs</button>' +
              '<button class="btn btn-quiet" data-act="back-events">More events</button>' +
            '</div>' +
          '</div>';
        $("view-confirm").innerHTML = html;
        show("confirm");
      }

      /* ---------------- my RSVPs ---------------- */
      function renderMine() {
        var box = $("view-mine");
        var html = "";
        if (MY.length === 0) {
          html = '<div class="empty"><p class="big">No RSVPs yet</p>' +
            '<p>When you RSVP for a Swamivatsalya, it will show up here so you can change your headcount or cancel.</p>' +
            '<button class="btn btn-primary" data-act="back-events">Browse events</button></div>';
        } else {
          MY.forEach(function (r) {
            html += '<article class="rsvp-card">' +
              '<h3>' + esc(r.title) + '</h3>' +
              '<p class="meta">' + esc(r.dateLabel) + (r.start_time ? ' · ' + esc(r.start_time) : "") + (r.place ? ' · ' + esc(r.place) : "") + '</p>' +
              '<div class="kv">' +
                (r.name ? '<span><b>' + esc(r.name) + '</b></span>' : "") +
                '<span>' + r.adults + ' adult' + (r.adults === 1 ? "" : "s") + (r.children ? ' · ' + r.children + ' child' + (r.children === 1 ? "" : "ren") : "") + '</span>' +
                (hasEmail(r) ? '<span class="chan-badge email">Email: ' + esc(maskEmail(r.email)) + '</span>' : "") +
                (hasPhone(r) ? '<span class="chan-badge whatsapp">WhatsApp: ' + esc(maskPhone(r.phone)) + '</span>' : "") +
              '</div>' +
              (r.comment ? '<p class="meta">“' + esc(r.comment) + '”</p>' : "") +
              '<div class="actions">' +
                '<button class="btn btn-ghost" data-act="edit" data-id="' + esc(r.rsvp_id) + '">Modify</button>' +
                '<button class="btn btn-danger" data-act="cancel-ask" data-id="' + esc(r.rsvp_id) + '">Cancel RSVP</button>' +
              '</div>' +
              '<div class="cancel-box" id="cancel-' + esc(r.rsvp_id) + '" hidden>' +
                '<p>Cancel this RSVP? Your ' + (r.adults + r.children) + ' spot' + (r.adults + r.children === 1 ? "" : "s") + ' will be released for others.</p>' +
                '<div class="row">' +
                  '<button class="btn btn-danger" data-act="cancel-yes" data-id="' + esc(r.rsvp_id) + '">Yes, cancel it</button>' +
                  '<button class="btn btn-quiet" data-act="cancel-no" data-id="' + esc(r.rsvp_id) + '">Keep my RSVP</button>' +
                '</div>' +
              '</div>' +
            '</article>';
          });
        }
        html += '<div class="panel" style="margin-top:16px;">' +
          '<h2 style="font-size:19px;">RSVP’d from another phone?</h2>' +
          '<p class="sub">Enter the email you used, and we will send you your personal manage link again.</p>' +
          '<div class="field" id="f-link-email"><label for="in-link-email">Email address</label>' +
          '<input type="email" id="in-link-email" inputmode="email" placeholder="you@example.com" /></div>' +
          '<div class="field is-disabled" id="f-link-phone"><label for="in-link-phone">Mobile / WhatsApp number <span class="hint">(not available yet)</span></label>' +
          '<input type="tel" id="in-link-phone" inputmode="tel" placeholder="WhatsApp coming soon" disabled /></div>' +
          '<div class="party-err" id="link-err" role="alert"></div>' +
          '<button class="btn btn-primary btn-block" data-act="send-link">Send me my manage link</button>' +
        '</div>';
        box.innerHTML = html;
      }

      function sendMyLink() {
        var email = $("in-link-email").value.trim();
        var phone = ""; // Phone lookup disabled until WhatsApp sending is enabled.
        var err = $("link-err");
        if (!email) {
          err.textContent = "Give the email you used for the RSVP.";
          err.classList.add("show"); return;
        }
        err.classList.remove("show");
        if (DEMO_MODE) {
          var mine = loadJson(DEMO_KEY, []);
          var phoneDigits = phone.replace(/\D/g, "");
          var found = mine.filter(function (r) {
            if (email && r.email && r.email.toLowerCase() === email.toLowerCase()) return true;
            if (phone && r.phone && r.phone.replace(/\D/g, "") === phoneDigits) return true;
            return false;
          })[0];
          if (found) { toast("Demo mode: your RSVP is already on this device, under My RSVPs."); }
          else { err.textContent = "Demo mode: no RSVP on this device matches that contact."; err.classList.add("show"); }
          return;
        }
        apiPost({ action: "sendMyLink", email: email, phone: phone })
          .then(function (data) {
            if (!data || !data.ok) throw new Error((data && data.error) || "Could not send the link.");
            toast("Manage link sent. Check your email.");
          })
          .catch(function (e) { err.textContent = e.message || String(e); err.classList.add("show"); });
      }

      function cancelRsvp(rsvpId) {
        var r = MY.filter(function (x) { return x.rsvp_id === rsvpId; })[0];
        if (!r) return;
        if (DEMO_MODE) {
          saveJson(DEMO_KEY, loadJson(DEMO_KEY, []).filter(function (x) { return x.rsvp_id !== rsvpId; }));
          EVENTS = demoEvents(); MY = demoMy();
          renderAll(); show("mine");
          toast("RSVP cancelled — your spots were released.");
          return;
        }
        apiPost({ action: "cancelRsvp", token: r.token, rsvp_id: rsvpId })
          .then(function (data) {
            if (!data || !data.ok) throw new Error((data && data.error) || "Could not cancel the RSVP.");
            dropDetail(rsvpId);
            return loadAll();
          })
          .then(function () { show("mine"); toast("RSVP cancelled — your spots were released."); })
          .catch(function (e) { toast(e.message || String(e)); });
      }

      /* ---------------- events wiring ---------------- */
      document.addEventListener("click", function (e) {
        // Switch tabs at once. The Events tab used to wait for the
        // ~4s listEvents fetch before switching views, so taps felt
        // dead and needed repeating; now it switches immediately and
        // refreshes in the background. closest() also catches taps on
        // the count badge inside the My RSVPs tab.
        var tabE = e.target.closest ? e.target.closest("#tab-events") : null;
        var tabM = e.target.closest ? e.target.closest("#tab-mine") : null;
        if (tabE) { show("events"); loadAll(); return; }
        if (tabM) { renderMine(); show("mine"); return; }
        var t = e.target.closest("[data-act]");
        if (!t) return;
        var act = t.getAttribute("data-act");
        var id = t.getAttribute("data-id");
        if (act === "rsvp") openForm(id, null);
        else if (act === "edit") openForm((MY.filter(function (x) { return x.rsvp_id === id; })[0] || {}).event_id, id);
        else if (act === "back-events") { renderEvents(); show("events"); }
        else if (act === "go-mine") { renderMine(); show("mine"); }
        else if (act === "reload") { loadAll().then(function () { show("events"); }); }
        else if (act === "step") {
          var who = t.getAttribute("data-who"), d = parseInt(t.getAttribute("data-d"), 10);
          if (who === "adults") formCtx.adults = Math.max(0, Math.min(20, formCtx.adults + d));
          else formCtx.children = Math.max(0, Math.min(20, formCtx.children + d));
          syncSteppers();
        }
        else if (act === "clear-saved") {
          clearSavedContact();
          var n = $("in-name"), em2 = $("in-email"), ph2 = $("in-phone");
          if (n) n.value = ""; if (em2) em2.value = ""; if (ph2) ph2.value = "";
          var noteEl = t.closest(".form-note"); if (noteEl) noteEl.remove();
          if (n) n.focus();
        }
        else if (act === "submit") submitForm();
        else if (act === "send-link") sendMyLink();
        else if (act === "subscribe") subscribeAnnounce();
        else if (act === "unsub") unsubscribeAnnounce();
        else if (act === "cancel-ask") { var b = $("cancel-" + id); if (b) b.hidden = false; }
        else if (act === "cancel-no") { var b2 = $("cancel-" + id); if (b2) b2.hidden = true; }
        else if (act === "cancel-yes") cancelRsvp(id);
      });

      /* ---------------- boot ---------------- */
      (function boot() {
        var tag = $("mode-tag");
        if (DEMO_MODE) {
          tag.textContent = "DEMO MODE";
          $("mode-note").textContent = "Sample events for testing the screens. RSVPs stay on this device only — nothing is sent, shared, or written to the Sheet.";
          $("footer-note").innerHTML = "Demo mode — sample events only. RSVPs are kept in this browser only.<br />Headcount only — JCGS Swamivatsalya RSVPs never include food items, and no payment is ever asked for.";
        } else {
          tag.textContent = "LIVE";
          tag.classList.add("live");
          $("mode-note").textContent = "RSVPs go to the temple Sheet. Counts are public; names are never shown publicly.";
          $("footer-note").innerHTML = "RSVPs are saved to the JCGS Sheet. Counts are public; names are never shown publicly.<br />Headcount only — JCGS Swamivatsalya RSVPs never include food items, and no payment is ever asked for.";
        }
        loadAll();
        show("events");
      })();
    </script>
  </body>
</html>
